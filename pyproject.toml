[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-supply-chain-provenance-verifier"
version = "0.1.0"
description = "In-toto compliant attestor verifying cryptographic hashes and signatures of third-party agent skills and MCP servers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-supply-chain-provenance-verifier = "agent_supply_chain_provenance_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_supply_chain_provenance_verifier*"]
